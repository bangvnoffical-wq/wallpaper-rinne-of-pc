<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Live Clock Wallpaper</title>
    <style>
        @font-face {
            font-family: 'Anurati';
            src: url('Anurati-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Đổi 'number.otf' thành đúng tên file font số của bạn */
        @font-face {
            font-family: 'NumberFont';
            src: url('number.otf') format('opentype'); 
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e293b; 
            color: #ffffff;
        }

        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Nếu ảnh của bạn là .png thì sửa 'background.jpg' thành tên file .png nhé */
            background: url('background.jpg') no-repeat center center/cover;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 0%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        .clock-container {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3;
            width: 100%;
            padding: 0 10px;
        }

        #day-of-week {
            font-family: 'Anurati', sans-serif;
            font-size: 3.75rem;
            font-weight: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        #date {
            font-family: 'Anurati', sans-serif;
            font-size: 1.5rem;
            color: #f1f5f9;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        #time-wrapper {
            font-family: 'NumberFont', sans-serif;
            font-size: 2.1rem;
            color: #ffffff;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="clock-container">
        <div id="day-of-week">---</div>
        <div id="date">---</div>
        <div id="time-wrapper">-<span id="time">00:00:00</span>-</div>
    </div>

    <script>
        function updateClock() {
            try {
                const now = new Date();
                const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
                document.getElementById('day-of-week').textContent = days[now.getDay()];

                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

                const dateNum = now.getDate();
                const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                const monthName = months[now.getMonth()];
                const year = now.getFullYear();
                document.getElementById('date').textContent = `${dateNum} ${monthName} ${year}`;
            } catch (e) {
                console.error(e);
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
