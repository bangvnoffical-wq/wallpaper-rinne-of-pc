<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Live Clock Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a; 
            color: #ffffff;
        }

        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Trỏ trực tiếp đến file ảnh mới của bạn */
            background: url('background.jpg') no-repeat center center/cover;
            z-index: 1;
        }

        /* Lớp phủ làm tối cực nhẹ để chữ nổi bật trên nền trời sáng */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 0%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        /* Đặt đồng hồ dịch lên cao hơn (vùng bầu trời xanh phía trên) */
        .clock-container {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 3;
            width: 100%;
            padding: 0 10px;
        }

        /* 1. Dòng Thứ */
        #day-of-week {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        /* 2. Dòng Ngày Tháng Năm */
        #date {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* 3. Dòng Giờ, Phút, Giây */
        #time-wrapper {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="background-container"></div>
    <div class="overlay"></div>

    <div class="clock-container">
        <div id="day-of-week">---</div>
        <div id="date">---</div>
        <div id="time-wrapper">-<span id="time">00:00:00</span>-</div>
    </div>

    <script>
        function updateClock() {
            try {
                const now = new Date();

                // 1. Thứ
                const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
                document.getElementById('day-of-week').textContent = days[now.getDay()];

                // 2. Giờ, phút, giây
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

                // 3. Ngày, tháng, năm
                const dateNum = now.getDate();
                const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                const monthName = months[now.getMonth()];
                const year = now.getFullYear();
                document.getElementById('date').textContent = `${dateNum} ${monthName} ${year}`;
            } catch (e) {
                console.error(e);
            }
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
